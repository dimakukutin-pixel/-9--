<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перевірочна робота 4–6</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 4–6</h1>

        <div class="quiz-block standalone-quiz" data-quiz="2">
          <div class="question">
            <p>1. Що таке файл?</p>
            <label><input type="radio" name="q4" value="a" /> Збережена інформація під назвою</label>
            <label><input type="radio" name="q4" value="b" /> Лише папка</label>
            <label><input type="radio" name="q4" value="c" /> Тільки зображення</label>
          </div>

          <div class="question">
            <p>2. Для чого призначені електронні таблиці?</p>
            <label><input type="radio" name="q5" value="a" /> Для обчислень і аналізу даних</label>
            <label><input type="radio" name="q5" value="b" /> Для редагування відео</label>
            <label><input type="radio" name="q5" value="c" /> Для друку документів</label>
          </div>

          <div class="question">
            <p>3. Що дає форматування тексту?</p>
            <label><input type="radio" name="q6" value="a" /> Робить документ зрозумілішим</label>
            <label><input type="radio" name="q6" value="b" /> Не дозволяє редагувати</label>
            <label><input type="radio" name="q6" value="c" /> Збільшує потужність комп'ютера</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
