<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перевірочна робота 10–12</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 10–12</h1>

        <div class="quiz-block standalone-quiz" data-quiz="4">
          <div class="question">
            <p>1. Яка роль умови в програмі?</p>
            <label><input type="radio" name="q10" value="a" /> Перевіряє істинність і вибирає дію</label>
            <label><input type="radio" name="q10" value="b" /> Змінює мову</label>
            <label><input type="radio" name="q10" value="c" /> Відкриває папку</label>
          </div>

          <div class="question">
            <p>2. Що таке цикл?</p>
            <label><input type="radio" name="q11" value="a" /> Повторення дій</label>
            <label><input type="radio" name="q11" value="b" /> Копіювання файлу</label>
            <label><input type="radio" name="q11" value="c" /> Пошук в інтернеті</label>
          </div>

          <div class="question">
            <p>3. Що таке комп'ютерна мережа?</p>
            <label><input type="radio" name="q12" value="a" /> Об'єднання пристроїв для обміну даними</label>
            <label><input type="radio" name="q12" value="b" /> Програма для редагування</label>
            <label><input type="radio" name="q12" value="c" /> Папка на робочому столі</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
