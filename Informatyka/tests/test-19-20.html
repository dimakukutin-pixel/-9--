  <head>

    <title>Перевірочна робота 19–20</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 19–20</h1>

        <div class="quiz-block standalone-quiz" data-quiz="7">
          <div class="question">
            <p>1. Що треба зробити перед розв'язанням задачі?</p>
            <label><input type="radio" name="q19" value="a" /> Уважно ознайомитися з умовою й скласти план</label>
            <label><input type="radio" name="q19" value="b" /> Натискати всі кнопки</label>
            <label><input type="radio" name="q19" value="c" /> Не читати задачу</label>
          </div>

          <div class="question">
            <p>2. Чому важлива перевірка відповіді?</p>
            <label><input type="radio" name="q20" value="a" /> Щоб переконатися, що рішення правильне</label>
            <label><input type="radio" name="q20" value="b" /> Щоб вимкнути комп'ютер</label>
            <label><input type="radio" name="q20" value="c" /> Щоб змінити пароль</label>
          </div>

          <div class="question">
            <p>3. Чому учням важливо вивчати інформатику?</p>
            <label><input type="radio" name="q21" value="a" /> Бо це допомагає працювати з технологіями й даними</label>
            <label><input type="radio" name="q21" value="b" /> Бо вона потрібна лише для ігор</label>
            <label><input type="radio" name="q21" value="c" /> Бо не потрібна в житті</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
