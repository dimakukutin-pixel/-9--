<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перевірочна робота 1–3</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 1–3</h1>

        <div class="quiz-block standalone-quiz" data-quiz="1">
          <div class="question">
            <p>1. Що вивчає інформатика?</p>
            <label><input type="radio" name="q1" value="a" /> Способи обробки та передачі інформації</label>
            <label><input type="radio" name="q1" value="b" /> Тільки історію комп'ютерів</label>
            <label><input type="radio" name="q1" value="c" /> Лише мову програмування</label>
          </div>

          <div class="question">
            <p>2. Яка функція процесора?</p>
            <label><input type="radio" name="q2" value="a" /> Керувати виконанням команд</label>
            <label><input type="radio" name="q2" value="b" /> Зберігати файли</label>
            <label><input type="radio" name="q2" value="c" /> Показувати зображення</label>
          </div>

          <div class="question">
            <p>3. Для чого потрібна операційна система?</p>
            <label><input type="radio" name="q3" value="a" /> Для взаємодії з пристроями й програмами</label>
            <label><input type="radio" name="q3" value="b" /> Для друку листів</label>
            <label><input type="radio" name="q3" value="c" /> Для читання книг</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
