<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перевірочна робота 13–15</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 13–15</h1>

        <div class="quiz-block standalone-quiz" data-quiz="5">
          <div class="question">
            <p>1. Як пошукова система знаходить інформацію?</p>
            <label><input type="radio" name="q13" value="a" /> За ключовими словами і релевантністю</label>
            <label><input type="radio" name="q13" value="b" /> За кольором сторінки</label>
            <label><input type="radio" name="q13" value="c" /> За географічною картою</label>
          </div>

          <div class="question">
            <p>2. Що обов'язково має бути в електронному листі?</p>
            <label><input type="radio" name="q14" value="a" /> Адресат і тема</label>
            <label><input type="radio" name="q14" value="b" /> Лише картинка</label>
            <label><input type="radio" name="q14" value="c" /> Лише число</label>
          </div>

          <div class="question">
            <p>3. Для чого використовують презентацію?</p>
            <label><input type="radio" name="q15" value="a" /> Для подання інформації в наочній формі</label>
            <label><input type="radio" name="q15" value="b" /> Для роботи з принтером</label>
            <label><input type="radio" name="q15" value="c" /> Для компілювання коду</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
