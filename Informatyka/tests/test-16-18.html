<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перевірочна робота 16–18</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 16–18</h1>

        <div class="quiz-block standalone-quiz" data-quiz="6">
          <div class="question">
            <p>1. Що таке база даних?</p>
            <label><input type="radio" name="q16" value="a" /> Організоване зберігання інформації</label>
            <label><input type="radio" name="q16" value="b" /> Назва програми</label>
            <label><input type="radio" name="q16" value="c" /> Тип принтера</label>
          </div>

          <div class="question">
            <p>2. Чому важливо захищати комп'ютер?</p>
            <label><input type="radio" name="q17" value="a" /> Щоб уберегти дані й систему від загроз</label>
            <label><input type="radio" name="q17" value="b" /> Щоб зменшити пам'ять</label>
            <label><input type="radio" name="q17" value="c" /> Щоб зникли документи</label>
          </div>

          <div class="question">
            <p>3. Яке значення має робота з графікою?</p>
            <label><input type="radio" name="q18" value="a" /> Допомагає створювати й редагувати зображення</label>
            <label><input type="radio" name="q18" value="b" /> Потрібна лише для музики</label>
            <label><input type="radio" name="q18" value="c" /> Не має значення</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
</html>
