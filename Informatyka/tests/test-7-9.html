<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Перевірочна робота 7–9</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="../index.html">Інформатика 9</a>
        <nav>
          <a href="../index.html#themes">Тематика</a>
          <a href="../index.html#tests">Тести</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <div class="container article-card">
        <p class="eyebrow">Перевірочна робота</p>
        <h1>Теми 7–9</h1>

        <div class="quiz-block standalone-quiz" data-quiz="3">
          <div class="question">
            <p>1. Що таке алгоритм?</p>
            <label><input type="radio" name="q7" value="a" /> Послідовність дій для досягнення мети</label>
            <label><input type="radio" name="q7" value="b" /> Назва пристрою</label>
            <label><input type="radio" name="q7" value="c" /> Вид файлу</label>
          </div>

          <div class="question">
            <p>2. Для чого потрібна блок-схема?</p>
            <label><input type="radio" name="q8" value="a" /> Для відображення логіки алгоритму</label>
            <label><input type="radio" name="q8" value="b" /> Для створення документів</label>
            <label><input type="radio" name="q8" value="c" /> Для запуску програм</label>
          </div>

          <div class="question">
            <p>3. У чому перевага Scratch?</p>
            <label><input type="radio" name="q9" value="a" /> У візуальному програмуванні</label>
            <label><input type="radio" name="q9" value="b" /> У роботі з фото</label>
            <label><input type="radio" name="q9" value="c" /> У створенні музики</label>
          </div>

          <button class="check-btn">Перевірити</button>
          <div class="result"></div>
        </div>

        <a class="primary-btn" href="../index.html#tests">Назад до тестів</a>
      </div>
    </main>

    <script src="../script.js"></script>
  </body>
